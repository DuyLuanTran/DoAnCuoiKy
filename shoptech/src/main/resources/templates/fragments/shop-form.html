<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="fields">
    <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}" role="alert">
        <p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p>
    </div>
    <div class="form-group"><label for="name">Tên shop *</label><input id="name" class="form-control" th:field="*{name}" maxlength="100" required placeholder="Ví dụ: Công nghệ An Khang"></div>
    <div class="row">
        <div class="col-md-6 form-group"><label for="email">Email liên hệ *</label><input id="email" class="form-control" type="email" th:field="*{email}" maxlength="100" required></div>
        <div class="col-md-6 form-group"><label for="phone">Điện thoại *</label><input id="phone" class="form-control" type="tel" th:field="*{phone}" maxlength="20" required></div>
    </div>
    <div class="form-group"><label for="address">Địa chỉ lấy hàng *</label><textarea id="address" class="form-control" th:field="*{address}" maxlength="500" rows="2" required></textarea></div>
    <div class="form-group"><label for="description">Giới thiệu shop</label><textarea id="description" class="form-control" th:field="*{description}" maxlength="2000" rows="4"></textarea></div>
</div>
</body></html>
