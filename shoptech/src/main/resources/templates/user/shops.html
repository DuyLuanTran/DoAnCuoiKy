<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Các shop | ShopTech</title><link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,500,700"><link rel="stylesheet" th:href="@{/user/css/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/user/css/font-awesome.min.css}"><link rel="stylesheet" th:href="@{/user/css/style.css}"><style th:replace="~{user/store :: style}"></style><link rel="stylesheet" th:href="@{/user/css/home.css}"><th:block th:replace="~{fragments/commerce :: head}"></th:block>
</head><body><th:block th:replace="~{fragments/commerce :: storeHeader}"></th:block><nav th:replace="~{fragments/store-navigation :: navigation('shops')}"></nav>
<main class="section"><div class="container"><div class="section-title home-section-heading"><div><h1 class="title">Các shop trên ShopTech</h1><p th:text="'Tìm thấy '+${shops.totalElements}+' shop đang hoạt động.'"></p></div><form class="shop-directory-search" th:action="@{/shops}" method="get"><label class="sr-only" for="shopKeyword">Tìm tên shop</label><input id="shopKeyword" class="input" type="search" name="keyword" maxlength="100" th:value="${shopKeyword}" placeholder="Nhập tên shop..."><button class="primary-btn" type="submit">Tìm kiếm</button><a th:if="${!#strings.isEmpty(shopKeyword)}" th:href="@{/shops}">Xóa tìm kiếm</a></form></div><p class="home-empty" th:if="${shops.empty}">Không tìm thấy shop phù hợp.</p><div class="row home-shop-grid"><div class="col-md-4 col-sm-6" th:each="shop : ${shops}"><article th:replace="~{fragments/shop-card :: card(${shop},${shopCounts[shop.id]})}"></article></div></div><nav class="home-pagination" th:if="${shops.totalPages > 1}" aria-label="Phân trang shop"><a th:if="${shops.hasPrevious()}" th:href="@{/shops(keyword=${shopKeyword},page=${shops.number-1})}">Trang trước</a><span th:text="'Trang '+${shops.number+1}"></span><a th:if="${shops.hasNext()}" th:href="@{/shops(keyword=${shopKeyword},page=${shops.number+1})}">Trang sau</a></nav></div></main>
<footer th:replace="~{user/store :: footer}"></footer><th:block th:replace="~{user/store :: storeScripts}"></th:block>
</body></html>
