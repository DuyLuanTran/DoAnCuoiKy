<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sản phẩm yêu thích | ShopTech</title>
<link rel="stylesheet" th:href="@{/user/css/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/user/css/font-awesome.min.css}"><link rel="stylesheet" th:href="@{/user/css/style.css}"><link rel="stylesheet" th:href="@{/user/css/marketplace.css}"><link rel="stylesheet" th:href="@{/user/css/home.css}"><style th:replace="~{user/store :: style}"></style><th:block th:replace="~{fragments/commerce :: head}"></th:block></head><body>
<th:block th:replace="~{fragments/commerce :: storeHeader}"></th:block><nav th:replace="~{fragments/store-navigation :: navigation('favorites')}"></nav>
<main class="section"><div class="container"><h2>Sản phẩm yêu thích</h2><p>Lưu lại sản phẩm để dễ tìm khi cần.</p><p th:if="${products.empty}">Bạn chưa có sản phẩm yêu thích đang được bán. <a th:href="@{/products}">Khám phá sản phẩm</a></p>
<div class="row home-product-grid"><div class="col-md-3 col-sm-6 col-xs-6" th:each="product : ${products}"><div th:replace="~{fragments/product-card :: card(${product},${null})}"></div></div></div>
<nav class="home-pagination" aria-label="Phân trang yêu thích" th:if="${products.totalPages > 1}"><a th:if="${products.hasPrevious()}" th:href="@{/favorites(page=${products.number-1})}">Trang trước</a><span th:text="'Trang '+${products.number+1}"></span><a th:if="${products.hasNext()}" th:href="@{/favorites(page=${products.number+1})}">Trang sau</a></nav></div></main>
<footer th:replace="~{user/store :: footer}"></footer><th:block th:replace="~{user/store :: storeScripts}"></th:block></body></html>
