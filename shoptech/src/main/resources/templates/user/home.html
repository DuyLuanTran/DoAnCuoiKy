<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trang khách hàng | ShopTech</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,500,700">
    <link rel="stylesheet" th:href="@{/user/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/user/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/user/css/style.css}">
<th:block th:replace="~{fragments/commerce :: head}"/><style th:replace="~{user/store :: style}"></style><style>.account-page #header .menu-toggle {display:none;}</style></head>
<body class="account-page">
<th:block th:replace="~{fragments/commerce :: storeHeader}"></th:block>
<main class="container user-home">
    <section class="user-home-card">
        <p class="eyebrow">KHU VỰC KHÁCH HÀNG</p>
        <h1>Xin chào, <span th:text="${account.fullName}"></span>!</h1>
        <p class="muted">Bạn đã đăng nhập thành công. Từ đây, bạn có thể tiếp tục mua sắm hoặc quản lý thông tin cá nhân.</p>
        <div class="user-home-actions"><a class="primary-btn" th:href="@{/shop-registration}">Shop của tôi</a><a sec:authorize="hasRole('SELLER')" class="primary-btn" th:href="@{/seller}">Quản lý shop</a><a class="primary-btn" th:href="@{/cart}">Giỏ hàng</a><a class="primary-btn" th:href="@{/orders}">Lịch sử đơn hàng</a>
            <a class="primary-btn" th:href="@{/products}"><i class="fa fa-shopping-bag"></i> Tiếp tục mua sắm</a>
            <a class="primary-btn" th:href="@{/account}"><i class="fa fa-user"></i> Thông tin tài khoản</a>
            <a sec:authorize="hasRole('ADMIN')" class="primary-btn" th:href="@{/admin}"><i class="fa fa-dashboard"></i> Trang quản trị</a>
        </div>
    </section>
</main>
<th:block th:replace="~{fragments/commerce :: scripts}"/></body>
</html>
