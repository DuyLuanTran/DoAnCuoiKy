<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ShopTech | Công nghệ từ các shop</title>
 <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,500,700">
 <link rel="stylesheet" th:href="@{/user/css/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/user/css/font-awesome.min.css}"><link rel="stylesheet" th:href="@{/user/css/style.css}">
 <style th:replace="~{user/store :: style}"></style><link rel="stylesheet" th:href="@{/user/css/marketplace.css}"><link rel="stylesheet" th:href="@{/user/css/home.css}">
 <th:block th:replace="~{fragments/commerce :: head}"></th:block>
</head>
<body class="market-home">
<th:block th:replace="~{fragments/commerce :: storeHeader}"></th:block>
<nav th:replace="~{fragments/store-navigation :: navigation('home')}"></nav>
<main>
<section class="section home-collections" th:unless="${#lists.isEmpty(promotions)}" aria-label="Khám phá danh mục"><div class="container"><div class="row">
 <div class="col-md-4 col-sm-4" th:each="product : ${promotions}"><div class="shop"><div class="shop-img"><img th:if="${product.mainImage != null}" th:src="${product.mainImage}" th:alt="${product.category.name}"></div><div class="shop-body"><h2 th:text="${product.category.name}"></h2><a class="cta-btn" th:href="@{/products(categoryId=${product.category.id})}">Khám phá ngay <i class="fa fa-arrow-circle-right" aria-hidden="true"></i></a></div></div></div>
</div></div></section>
<section class="section home-popular" aria-labelledby="popular-title"><div class="container">
 <div class="section-title home-section-heading"><div><h2 class="title" id="popular-title">Sản phẩm bán trên 10</h2><p>Được xếp theo số sản phẩm đã mua hoàn tất, từ cao xuống thấp.</p></div><a class="home-see-all" th:href="@{/products(sort='bestSelling',minSold=11,size=20)}">Xem tất cả <i class="fa fa-angle-right" aria-hidden="true"></i></a></div>
 <p class="home-empty" th:if="${popularProducts.empty}">Chưa có sản phẩm có trên 10 lượt mua hoàn tất.</p>
 <div class="row home-product-grid" th:unless="${popularProducts.empty}"><div class="col-md-3 col-sm-6 col-xs-6" th:each="product : ${popularProducts}"><div th:replace="~{fragments/product-card :: card(${product},${soldCounts[product.id]})}"></div></div></div>
</div></section>
<section id="home-products" class="section" aria-labelledby="home-products-title"><div class="container">
 <div class="section-title home-section-heading"><h2 class="title" id="home-products-title" th:text="${feed == 'bestSelling'} ? 'Sản phẩm bán chạy' : 'Sản phẩm mới'"></h2><ul class="section-tab-nav home-feed-tabs"><li th:classappend="${feed == 'newest'} ? 'active'"><a th:href="@{/(feed='newest')}+'#home-products'">Mới nhất</a></li><li th:classappend="${feed == 'bestSelling'} ? 'active'"><a th:href="@{/(feed='bestSelling')}+'#home-products'">Bán chạy</a></li></ul></div>
 <p class="home-empty" th:if="${products.empty}" th:text="${feed == 'bestSelling'} ? 'Chưa có lượt mua hoàn tất để xếp hạng. Bạn có thể xem sản phẩm mới.' : 'Chưa có sản phẩm đang bán.'"></p>
 <div class="row home-product-grid"><div class="col-md-3 col-sm-6 col-xs-6" th:each="product,item : ${products}"><div th:replace="~{fragments/product-card :: card(${product},${soldCounts[product.id]})}"></div></div></div>
 <div class="home-pagination"><span th:unless="${products.empty}" th:text="'Hiển thị '+${products.number*products.size+1}+'–'+${products.number*products.size+products.numberOfElements}+' / '+${products.totalElements}+' sản phẩm'"></span><nav aria-label="Phân trang sản phẩm trang chủ" th:if="${products.totalPages > 1}"><a th:if="${products.hasPrevious()}" th:href="@{/(feed=${feed},page=${products.number-1})}+'#home-products'">Trang trước</a><span th:text="'Trang '+${products.number+1}"></span><a th:if="${products.hasNext()}" th:href="@{/(feed=${feed},page=${products.number+1})}+'#home-products'">Trang sau</a></nav></div>
</div></section>
<section class="section home-shops" aria-labelledby="home-shops-title"><div class="container"><div class="section-title home-section-heading"><h2 class="title" id="home-shops-title">Các shop trên ShopTech</h2><a class="home-see-all" th:href="@{/shops}">Xem tất cả shop <i class="fa fa-angle-right" aria-hidden="true"></i></a></div><p class="home-empty" th:if="${featuredShops.empty}">Chưa có shop đang hoạt động.</p><div class="row home-shop-grid"><div class="col-md-4 col-sm-6" th:each="shop : ${featuredShops}"><article th:replace="~{fragments/shop-card :: card(${shop},${shopCounts[shop.id]})}"></article></div></div></div></section>
<div class="container home-browse-more"><a class="primary-btn" th:href="@{/products}">Tiếp tục mua sắm</a></div>
</main>
<footer th:replace="~{user/store :: footer}"></footer>
<th:block th:replace="~{user/store :: storeScripts}"></th:block>
</body></html>
