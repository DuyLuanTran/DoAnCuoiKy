<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đặt lại mật khẩu | ShopTech</title>
    <link rel="stylesheet" th:href="@{/admin/css/sb-admin-2.min.css}">
    <link rel="stylesheet" th:href="@{/admin/css/user-management.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <div class="auth-brand">SHOPTECH</div>
    <h1>Tạo mật khẩu mới</h1>
    <p class="muted">Liên kết chỉ dùng được một lần và hết hạn sau 15 phút.</p>
    <div class="notice error" th:if="${#fields.hasGlobalErrors()}">
        <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
    </div>
    <form th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post">
        <input type="hidden" th:field="*{token}">
        <small class="field-error" th:errors="*{token}"></small>
        <label for="password">Mật khẩu mới (8–72 ký tự)</label>
        <input id="password" th:field="*{password}" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
        <small class="field-error" th:errors="*{password}"></small>
        <label for="confirmPassword">Nhập lại mật khẩu</label>
        <input id="confirmPassword" th:field="*{confirmPassword}" type="password" autocomplete="new-password" required>
        <small class="field-error" th:errors="*{confirmPassword}"></small>
        <small class="field-error" th:errors="*{passwordConfirmationValid}"></small>
        <button class="button primary full-width" type="submit">Lưu mật khẩu mới</button>
    </form>
    <p class="auth-footer"><a th:href="@{/login}">Quay lại đăng nhập</a></p>
</main>
</body>
</html>
