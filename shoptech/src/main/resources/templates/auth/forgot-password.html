<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quên mật khẩu | ShopTech</title>
    <link rel="stylesheet" th:href="@{/admin/css/sb-admin-2.min.css}">
    <link rel="stylesheet" th:href="@{/admin/css/user-management.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <div class="auth-brand">SHOPTECH</div>
    <h1>Quên mật khẩu?</h1>
    <p class="muted">Nhập email đã đăng ký. Nếu tài khoản tồn tại, hướng dẫn đặt lại mật khẩu sẽ được gửi tới email đó.</p>
    <div class="notice success" th:if="${resetRequestSubmitted}">
        Nếu email đã đăng ký, bạn sẽ nhận được liên kết đặt lại mật khẩu trong ít phút.
    </div>
    <form th:action="@{/forgot-password}" th:object="${forgotPasswordForm}" method="post">
        <label for="email">Email</label>
        <input id="email" th:field="*{email}" type="email" autocomplete="email" maxlength="100" required>
        <small class="field-error" th:errors="*{email}"></small>
        <button class="button primary full-width" type="submit">Gửi liên kết đặt lại</button>
    </form>
    <p class="auth-footer"><a th:href="@{/login}">Quay lại đăng nhập</a></p>
</main>
</body>
</html>
