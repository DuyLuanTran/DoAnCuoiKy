<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/admin-layout :: layout(
          'Quản lý danh mục',
          'categories',
          ~{::section}
      )}"
>
  <head>
    <meta charset="UTF-8" />
    <title>Quản lý danh mục</title>
  </head>

  <body>
    <section>
      <div
        class="d-flex flex-wrap align-items-center justify-content-between mb-4"
      >
        <h1 class="h3 mb-2 text-gray-800">Quản lý danh mục</h1>

        <a class="btn btn-primary mb-2" th:href="@{/admin/categories/new}">
          <i class="fas fa-plus mr-1" aria-hidden="true"></i>
          Thêm danh mục
        </a>
      </div>

      <div class="card shadow mb-4">
        <div class="card-header py-3">
          <h2 class="h6 m-0 font-weight-bold text-primary">
            Danh sách danh mục
          </h2>
        </div>

        <div class="card-body">
          <form th:action="@{/admin/categories}" method="get" class="mb-4">
            <div class="form-row align-items-end">
              <div class="col-md-6 mb-2">
                <label for="keyword">Tên danh mục</label>
                <input
                  class="form-control"
                  id="keyword"
                  name="keyword"
                  type="search"
                  th:value="${keyword}"
                  placeholder="Nhập tên danh mục..."
                />
              </div>

              <div class="col-md-2 mb-2">
                <label for="size">Danh mục mỗi trang</label>
                <select class="form-control" id="size" name="size">
                  <option value="10" th:selected="${categories.size == 10}">
                    10
                  </option>
                  <option value="20" th:selected="${categories.size == 20}">
                    20
                  </option>
                  <option value="50" th:selected="${categories.size == 50}">
                    50
                  </option>
                </select>
              </div>

              <div class="col-md-4 mb-2">
                <button class="btn btn-primary" type="submit">Tìm kiếm</button>

                <a
                  class="btn btn-outline-secondary"
                  th:href="@{/admin/categories}"
                >
                  Xóa lọc
                </a>
              </div>
            </div>
          </form>

          <div class="table-responsive">
            <table class="table table-bordered table-hover">
              <caption class="sr-only">
                Danh sách danh mục sản phẩm
              </caption>

              <thead class="thead-light">
                <tr>
                  <th scope="col">ID</th>
                  <th scope="col">Tên danh mục</th>
                  <th scope="col">Slug</th>
                  <th scope="col">Trạng thái</th>
                  <th scope="col">Thao tác</th>
                </tr>
              </thead>

              <tbody>
                <tr th:each="category : ${categories.content}">
                  <td th:text="${category.id}"></td>
                  <td th:text="${category.name}"></td>
                  <td th:text="${category.slug}"></td>

                  <td>
                    <span
                      class="badge"
                      th:classappend="${category.isActive}
                                      ? 'badge-success'
                                      : 'badge-secondary'"
                      th:text="${category.isActive}
                                      ? 'Đang bật'
                                      : 'Đang ẩn'"
                    >
                    </span>
                  </td>

                  <td>
                    <div class="d-flex flex-wrap">
                      <a
                        class="btn btn-sm btn-outline-primary mr-2 mb-1"
                        th:href="@{/admin/categories/{id}/edit(
                                       id=${category.id}
                                   )}"
                      >
                        Sửa
                      </a>

                      <form
                        class="mb-1"
                        th:action="@{/admin/categories/{id}/delete(
                                          id=${category.id}
                                      )}"
                        method="post"
                        onsubmit="
                          return confirm('Chuyển danh mục này vào thùng rác?');
                        "
                      >
                        <button
                          class="btn btn-sm btn-outline-danger"
                          type="submit"
                        >
                          Xóa
                        </button>
                      </form>
                    </div>
                  </td>
                </tr>

                <tr th:if="${categories.empty}">
                  <td colspan="5" class="text-center text-muted py-4">
                    Không tìm thấy danh mục phù hợp.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div
            class="d-flex flex-wrap align-items-center justify-content-between"
          >
            <p
              class="text-muted mb-2"
              th:text="'Tổng cộng: ' + ${categories.totalElements}
                       + ' danh mục'"
            ></p>

            <nav
              th:if="${categories.totalPages > 1}"
              aria-label="Phân trang danh mục"
            >
              <ul class="pagination mb-2">
                <li class="page-item" th:if="${categories.hasPrevious()}">
                  <a
                    class="page-link"
                    th:href="@{/admin/categories(
                                   page=${categories.number - 1},
                                   size=${categories.size},
                                   keyword=${keyword}
                               )}"
                  >
                    Trước
                  </a>
                </li>

                <li class="page-item disabled">
                  <span
                    class="page-link"
                    th:text="'Trang '
                                      + ${categories.number + 1}
                                      + ' / '
                                      + ${categories.totalPages}"
                  >
                  </span>
                </li>

                <li class="page-item" th:if="${categories.hasNext()}">
                  <a
                    class="page-link"
                    th:href="@{/admin/categories(
                                   page=${categories.number + 1},
                                   size=${categories.size},
                                   keyword=${keyword}
                               )}"
                  >
                    Sau
                  </a>
                </li>
              </ul>
            </nav>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
