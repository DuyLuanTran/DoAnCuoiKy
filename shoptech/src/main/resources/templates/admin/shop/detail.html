<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin-layout :: layout('Chi tiết shop','shops',~{::main})}"><body><main>
<a class="d-inline-block mb-3" th:href="@{/admin/shops}">← Danh sách shop</a>
<div class="d-flex align-items-center justify-content-between mb-4"><h1 class="h3 mb-0 text-gray-800" th:text="${shop.name}"></h1><span class="badge badge-primary p-2" th:text="${shop.status}"></span></div>
<div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<div class="row"><div class="col-lg-7">
    <div class="card shadow mb-4"><div class="card-header"><h2 class="h6 m-0 font-weight-bold text-primary">Thông tin đăng ký</h2></div><div class="card-body">
        <dl class="row mb-0"><dt class="col-sm-4">Chủ shop</dt><dd class="col-sm-8" th:text="${shop.owner.username}"></dd><dt class="col-sm-4">Email</dt><dd class="col-sm-8" th:text="${shop.email}"></dd><dt class="col-sm-4">Điện thoại</dt><dd class="col-sm-8" th:text="${shop.phone}"></dd><dt class="col-sm-4">Địa chỉ lấy hàng</dt><dd class="col-sm-8" th:text="${shop.address}"></dd><dt class="col-sm-4">Giới thiệu</dt><dd class="col-sm-8" style="white-space:pre-wrap;overflow-wrap:anywhere" th:text="${shop.description}"></dd></dl>
        <div class="alert alert-warning mb-0" th:if="${shop.status.name() == 'REJECTED'}" th:text="${shop.rejectionReason}"></div><div class="alert alert-warning mb-0" th:if="${shop.status.name() == 'SUSPENDED'}" th:text="${shop.suspensionReason}"></div>
    </div></div>
    <div class="card shadow mb-4"><div class="card-header"><h2 class="h6 m-0 font-weight-bold text-primary">Lịch sử xét duyệt</h2></div><div class="card-body"><p class="text-muted" th:if="${#lists.isEmpty(history)}">Chưa có thao tác xét duyệt.</p><div class="border-bottom pb-3 mb-3" th:each="event : ${history}"><strong th:text="${event.previousStatus} + ' → ' + ${event.newStatus}"></strong><small class="d-block text-muted" th:text="${event.actor.username} + ' · ' + ${#temporals.format(event.createdAt.atZoneSameInstant(T(java.time.ZoneId).of('Asia/Ho_Chi_Minh')),'dd/MM/yyyy HH:mm')}"></small><p class="mb-0 mt-1" style="overflow-wrap:anywhere" th:text="${event.reason}"></p></div></div></div>
</div><div class="col-lg-5">
    <div class="card shadow mb-4"><div class="card-header"><h2 class="h6 m-0 font-weight-bold text-primary">Xử lý shop</h2></div><div class="card-body">
        <form th:if="${shop.status.name() == 'PENDING'}" th:action="@{/admin/shops/{id}/approve(id=${shop.id})}" method="post" class="mb-3"><input type="hidden" name="expectedStatus" th:value="${shop.status}"><button class="btn btn-success btn-block" type="submit">Duyệt đăng ký shop</button></form>
        <form th:if="${shop.status.name() == 'PENDING' or shop.status.name() == 'ACTIVE'}" th:action="@{/admin/shops/{id}/{action}(id=${shop.id},action=${shop.status.name() == 'PENDING' ? 'reject' : 'suspend'})}" method="post"><input type="hidden" name="expectedStatus" th:value="${shop.status}"><div class="form-group"><label for="reason" th:text="${shop.status.name() == 'PENDING'} ? 'Lý do từ chối' : 'Lý do khóa shop'"></label><textarea class="form-control" id="reason" name="reason" rows="3" maxlength="1000" required></textarea></div><button class="btn btn-outline-danger btn-block" type="submit" th:text="${shop.status.name() == 'PENDING'} ? 'Từ chối đăng ký' : 'Khóa shop'"></button></form>
        <form th:if="${shop.status.name() == 'SUSPENDED'}" th:action="@{/admin/shops/{id}/resume(id=${shop.id})}" method="post"><input type="hidden" name="expectedStatus" th:value="${shop.status}"><button class="btn btn-success btn-block" type="submit">Mở lại shop</button></form>
        <p th:if="${shop.status.name() == 'REJECTED'}" class="text-muted mb-0">Chờ chủ shop chỉnh sửa và gửi lại hồ sơ.</p>
    </div></div>
    <div class="card shadow mb-4"><div class="card-header"><h2 class="h6 m-0 font-weight-bold text-primary">Chiết khấu của shop</h2></div><div class="card-body"><p>Mức áp dụng: <strong th:text="${effectiveRate} + '%'"></strong></p>
        <form th:action="@{/admin/shops/{id}/commission(id=${shop.id})}" method="post"><label for="shop-rate">Mức riêng (%)</label><input class="form-control mb-2" id="shop-rate" type="number" name="rate" min="0" max="100" step="0.01" th:value="${shop.commissionRate}" placeholder="Để trống để dùng mặc định"><small class="text-muted d-block mb-3" th:text="'Mặc định của sàn: ' + ${defaultRate} + '%'"></small><button class="btn btn-primary" type="submit">Lưu chiết khấu</button></form>
    </div></div>
</div></div>
</main></body></html>
