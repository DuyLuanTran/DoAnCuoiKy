<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin-layout :: layout('Giám sát sản phẩm','products',~{::main})}"><body><main>
<a class="d-inline-block mb-3" th:href="@{/admin/products}">← Danh sách sản phẩm</a><h1 class="h3 mb-4 text-gray-800">Giám sát sản phẩm</h1>
<div class="row"><div class="col-lg-7"><div class="card shadow mb-4"><div class="card-header"><h2 class="h6 m-0 text-primary font-weight-bold" th:text="${product.name}"></h2></div><div class="card-body">
<img th:if="${product.mainImage != null}" th:src="${product.mainImage}" th:alt="${product.name}" width="160" height="160" style="object-fit:contain" class="mb-4">
<dl class="row"><dt class="col-sm-4">Shop</dt><dd class="col-sm-8"><a th:href="@{/admin/shops/{id}(id=${product.shop.id})}" th:text="${product.shop.name}"></a></dd><dt class="col-sm-4">Mã sản phẩm</dt><dd class="col-sm-8" th:text="${product.sku}"></dd><dt class="col-sm-4">Danh mục</dt><dd class="col-sm-8" th:text="${product.category.name}"></dd><dt class="col-sm-4">Giá niêm yết</dt><dd class="col-sm-8" th:text="${#numbers.formatDecimal(product.price,1,'POINT',0,'COMMA')} + ' ₫'"></dd><dt class="col-sm-4">Tồn kho</dt><dd class="col-sm-8" th:text="${product.stockQuantity}"></dd></dl>
<p class="text-muted mb-0">Thông tin, giá và tồn kho do Seller quản lý.</p></div></div>
<div class="card shadow mb-4"><div class="card-header"><h2 class="h6 m-0 text-primary font-weight-bold">Lịch sử giám sát</h2></div><div class="card-body"><p th:if="${#lists.isEmpty(history)}" class="text-muted">Chưa có thao tác giám sát.</p><div class="border-bottom mb-3 pb-3" th:each="event : ${history}"><strong th:text="${event.blocked} ? 'Tạm ẩn' : 'Gỡ tạm ẩn'"></strong><small class="d-block text-muted" th:text="${event.actor.username} + ' · ' + ${#temporals.format(event.createdAt.atZoneSameInstant(T(java.time.ZoneId).of('Asia/Ho_Chi_Minh')),'dd/MM/yyyy HH:mm')}"></small><p class="mb-0" th:text="${event.reason}"></p></div></div></div>
</div><div class="col-lg-5"><div class="card shadow mb-4"><div class="card-header"><h2 class="h6 m-0 text-primary font-weight-bold">Xử lý hiển thị</h2></div><div class="card-body"><p>Trạng thái: <strong th:text="${product.isBlocked} ? 'Sàn đang tạm ẩn' : 'Không bị sàn tạm ẩn'"></strong></p><p class="text-danger" th:if="${product.isBlocked}" th:text="${product.moderationReason}"></p>
<form th:action="@{/admin/products/{id}/moderation(id=${product.id})}" method="post"><input type="hidden" name="blocked" th:value="${!product.isBlocked}"><input type="hidden" name="expectedBlocked" th:value="${product.isBlocked}"><div class="form-group"><label for="reason">Lý do xử lý *</label><textarea class="form-control" id="reason" name="reason" maxlength="1000" rows="4" required></textarea></div><button class="btn" th:classappend="${product.isBlocked} ? 'btn-success' : 'btn-outline-danger'" type="submit" th:text="${product.isBlocked} ? 'Gỡ tạm ẩn' : 'Tạm ẩn sản phẩm'"></button></form>
</div></div></div></div></main></body></html>
