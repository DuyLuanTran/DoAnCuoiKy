<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin-layout :: layout('Đơn hàng','orders',~{::main})}"><body><main>
<h1>Quản lý đơn hàng</h1><form method="get" th:action="@{/admin/orders}" class="form-inline mb-3">
<input class="form-control mr-2" name="keyword" th:value="${keyword}" maxlength="100" placeholder="Mã đơn / khách hàng" aria-label="Tìm đơn hàng">
<select class="form-control mr-2" name="status" aria-label="Trạng thái"><option value="">Tất cả trạng thái</option><option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == status}"></option></select><button class="btn btn-primary">Tìm kiếm</button></form>
<p th:if="${orders.empty}">Không có đơn hàng phù hợp.</p><div class="table-responsive"><table class="table table-bordered"><thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Người nhận</th><th>Ngày đặt</th><th>Tổng tiền</th><th>Trạng thái</th></tr></thead><tbody>
<tr th:each="order : ${orders}"><td><a th:href="@{/admin/orders/{id}(id=${order.id})}" th:text="${order.code}"></a></td><td th:text="${order.customer}"></td><td th:text="${order.recipientName}"></td><td th:text="${#temporals.format(order.createdAt.atZoneSameInstant(T(java.time.ZoneId).of('Asia/Ho_Chi_Minh')),'dd/MM/yyyy HH:mm')}"></td><td th:text="${#numbers.formatDecimal(order.total,1,'POINT',0,'COMMA')}+' ₫'"></td><td th:text="${order.status}"></td></tr></tbody></table></div>
<nav><a th:if="${orders.hasPrevious()}" th:href="@{/admin/orders(keyword=${keyword},status=${status},page=${orders.number-1})}">Trang trước</a> <span th:text="${orders.number+1}"></span> <a th:if="${orders.hasNext()}" th:href="@{/admin/orders(keyword=${keyword},status=${status},page=${orders.number+1})}">Trang sau</a></nav>
</main></body></html>
