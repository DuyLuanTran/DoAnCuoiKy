<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý người dùng | ShopTech</title>
    <link rel="stylesheet" th:href="@{/admin/css/sb-admin-2.min.css}">
    <link rel="stylesheet" th:href="@{/admin/css/user-management.css}">
</head>
<body class="admin-page">
<header class="topbar">
    <a class="brand" th:href="@{/admin/users}">SHOPTECH <span>Quản trị</span></a>
    <nav><a class="active" th:href="@{/admin/users}">Người dùng</a><a th:href="@{/admin/users/trash}">Thùng rác</a><a th:href="@{/account}">Tài khoản</a></nav>
    <form th:action="@{/logout}" method="post"><button class="button secondary" type="submit">Đăng xuất</button></form>
</header>
<main class="page-container">
    <div class="page-heading">
        <div><p class="eyebrow">QUẢN TRỊ HỆ THỐNG</p><h1>Quản lý người dùng</h1><p class="muted">Tìm kiếm, cập nhật trạng thái và quản lý tài khoản khách hàng.</p></div>
        <a class="button primary" th:href="@{/admin/users/new}">+ Tạo tài khoản</a>
    </div>

    <div class="notice success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="notice error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <section class="panel">
        <form class="search-form" th:action="@{/admin/users}" method="get">
            <label class="sr-only" for="keyword">Tìm theo tên, email hoặc tên đăng nhập</label>
            <input id="keyword" name="keyword" th:value="${keyword}" placeholder="Tìm theo tên, email hoặc tên đăng nhập">
            <button class="button primary" type="submit">Tìm kiếm</button>
            <a class="button secondary" th:href="@{/admin/users}">Xóa lọc</a>
        </form>
        <div class="table-scroll">
            <table>
                <thead><tr><th>ID</th><th>Người dùng</th><th>Email / Điện thoại</th><th>Vai trò</th><th>Trạng thái</th><th class="actions-heading">Thao tác</th></tr></thead>
                <tbody>
                <tr th:each="user : ${users.content}">
                    <td th:text="${user.id}"></td>
                    <td><strong th:text="${user.fullName}"></strong><span class="subtext" th:text="${user.username}"></span></td>
                    <td><span th:text="${user.email}"></span><span class="subtext" th:text="${user.phoneNumber ?: 'Chưa cập nhật'}"></span></td>
                    <td><span class="role-chip" th:each="role : ${user.roles}" th:text="${role.name == 'ROLE_ADMIN' ? 'Quản trị' : 'Khách hàng'}"></span></td>
                    <td><span class="status" th:classappend="${user.isActive} ? ' status-active' : ' status-locked'" th:text="${user.isActive} ? 'Hoạt động' : 'Đã khóa'"></span></td>
                    <td class="actions">
                        <a class="button small secondary" th:href="@{/admin/users/{id}/edit(id=${user.id})}">Sửa</a>
                        <form th:action="@{/admin/users/{id}/toggle-active(id=${user.id})}" method="post">
                            <button class="button small secondary" type="submit" th:text="${user.isActive} ? 'Khóa' : 'Mở khóa'"></button>
                        </form>
                        <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" onsubmit="return confirm('Chuyển tài khoản này vào thùng rác?')">
                            <button class="button small danger" type="submit">Xóa</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${users.empty}"><td class="empty-cell" colspan="6">Không tìm thấy người dùng phù hợp.</td></tr>
                </tbody>
            </table>
        </div>
        <div class="table-footer">
            <span th:text="${users.totalElements} + ' tài khoản'"></span>
            <div class="pagination" th:if="${users.totalPages > 1}">
                <a th:if="${users.hasPrevious()}" th:href="@{/admin/users(page=${users.number - 1},size=${users.size},keyword=${keyword})}">Trước</a>
                <a th:each="pageNumber : ${#numbers.sequence(0, users.totalPages - 1)}"
                   th:href="@{/admin/users(page=${pageNumber},size=${users.size},keyword=${keyword})}"
                   th:classappend="${pageNumber == users.number} ? ' selected'"
                   th:text="${pageNumber + 1}"></a>
                <a th:if="${users.hasNext()}" th:href="@{/admin/users(page=${users.number + 1},size=${users.size},keyword=${keyword})}">Sau</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
