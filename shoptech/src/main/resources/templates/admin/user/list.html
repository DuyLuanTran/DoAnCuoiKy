<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/admin-layout :: layout(
      'Quản lý người dùng',
      'users',
      ~{::main}
  )}"
>
  <body>
    <main>
      <div class="d-flex flex-wrap align-items-center justify-content-between mb-4">
        <div>
          <h1 class="h3 mb-1 text-gray-800">Quản lý người dùng</h1>
          <p class="text-muted mb-2">Tìm kiếm, cập nhật trạng thái và quản lý tài khoản.</p>
        </div>
        <div class="d-flex flex-wrap mb-2">
          <a class="btn btn-primary mr-2 mb-1" th:href="@{/admin/users/new}">
            <i class="fas fa-plus mr-1" aria-hidden="true"></i>
            Tạo tài khoản
          </a>
          <a class="btn btn-outline-secondary mb-1" th:href="@{/admin/users/trash}">
            <i class="fas fa-trash mr-1" aria-hidden="true"></i>
            Thùng rác
          </a>
        </div>
      </div>

      <div class="card shadow mb-4">
        <div class="card-header py-3">
          <h2 class="h6 m-0 font-weight-bold text-primary">Danh sách người dùng</h2>
        </div>

        <div class="card-body">
          <form th:action="@{/admin/users}" method="get" class="mb-4">
            <div class="form-row align-items-end">
              <div class="col-md-6 mb-2">
                <label for="keyword">Tìm theo tên, email hoặc tên đăng nhập</label>
                <input
                  class="form-control"
                  id="keyword"
                  name="keyword"
                  type="search"
                  th:value="${keyword}"
                  placeholder="Nhập thông tin cần tìm..."
                />
              </div>
              <div class="col-md-2 mb-2">
                <label for="size">Người dùng mỗi trang</label>
                <select class="form-control" id="size" name="size">
                  <option value="10" th:selected="${users.size == 10}">10</option>
                  <option value="20" th:selected="${users.size == 20}">20</option>
                  <option value="50" th:selected="${users.size == 50}">50</option>
                </select>
              </div>
              <div class="col-md-4 mb-2">
                <button class="btn btn-primary mr-1" type="submit">Tìm kiếm</button>
                <a class="btn btn-outline-secondary" th:href="@{/admin/users}">Xóa lọc</a>
              </div>
            </div>
          </form>

          <div class="table-responsive">
            <table class="table table-bordered table-hover">
              <caption class="sr-only">Danh sách tài khoản người dùng</caption>
              <thead class="thead-light">
                <tr>
                  <th scope="col">ID</th>
                  <th scope="col">Người dùng</th>
                  <th scope="col">Email / Điện thoại</th>
                  <th scope="col">Vai trò</th>
                  <th scope="col">Trạng thái</th>
                  <th scope="col">Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="user : ${users.content}">
                  <td th:text="${user.id}"></td>
                  <td>
                    <strong th:text="${user.fullName}"></strong>
                    <span class="d-block text-muted small" th:text="${user.username}"></span>
                  </td>
                  <td>
                    <span th:text="${user.email}"></span>
                    <span class="d-block text-muted small" th:text="${user.phoneNumber ?: 'Chưa cập nhật'}"></span>
                  </td>
                  <td>
                    <span
                      class="badge badge-light mr-1"
                      th:each="role : ${user.roles}"
                      th:text="${role.name == 'ROLE_ADMIN' ? 'Quản trị' : 'Khách hàng'}"
                    ></span>
                  </td>
                  <td>
                    <span
                      class="badge"
                      th:classappend="${user.isActive} ? 'badge-success' : 'badge-secondary'"
                      th:text="${user.isActive} ? 'Hoạt động' : 'Đã khóa'"
                    ></span>
                  </td>
                  <td>
                    <div class="d-flex flex-wrap">
                      <a
                        class="btn btn-sm btn-outline-primary mr-1 mb-1"
                        th:href="@{/admin/users/{id}/edit(id=${user.id})}"
                      >Sửa</a>
                      <form
                        class="mr-1 mb-1"
                        th:action="@{/admin/users/{id}/toggle-active(id=${user.id})}"
                        method="post"
                      >
                        <button
                          class="btn btn-sm btn-outline-secondary"
                          type="submit"
                          th:text="${user.isActive} ? 'Khóa' : 'Mở khóa'"
                        ></button>
                      </form>
                      <form
                        class="mb-1"
                        th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                        method="post"
                        onsubmit="return confirm('Chuyển tài khoản này vào thùng rác?');"
                      >
                        <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
                      </form>
                    </div>
                  </td>
                </tr>
                <tr th:if="${users.empty}">
                  <td colspan="6" class="text-center text-muted py-4">
                    Không tìm thấy người dùng phù hợp.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="d-flex flex-wrap align-items-center justify-content-between">
            <p
              class="text-muted mb-2"
              th:text="'Tổng cộng: ' + ${users.totalElements} + ' tài khoản'"
            ></p>
            <nav th:if="${users.totalPages > 1}" aria-label="Phân trang người dùng">
              <ul class="pagination mb-2">
                <li class="page-item" th:if="${users.hasPrevious()}">
                  <a
                    class="page-link"
                    th:href="@{/admin/users(page=${users.number - 1},size=${users.size},keyword=${keyword})}"
                  >Trước</a>
                </li>
                <li class="page-item disabled">
                  <span
                    class="page-link"
                    th:text="'Trang ' + ${users.number + 1} + ' / ' + ${users.totalPages}"
                  ></span>
                </li>
                <li class="page-item" th:if="${users.hasNext()}">
                  <a
                    class="page-link"
                    th:href="@{/admin/users(page=${users.number + 1},size=${users.size},keyword=${keyword})}"
                  >Sau</a>
                </li>
              </ul>
            </nav>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
