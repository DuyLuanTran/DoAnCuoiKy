<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/admin-layout :: layout(
      ${formTitle},
      'users',
      ~{::main}
  )}"
>
  <body>
    <main>
      <div class="d-flex flex-wrap align-items-center justify-content-between mb-4">
        <div>
          <h1 class="h3 mb-1 text-gray-800" th:text="${formTitle}"></h1>
          <p class="text-muted mb-2">Nhập thông tin tài khoản người dùng.</p>
        </div>
        <a class="btn btn-outline-secondary mb-2" th:href="@{/admin/users}">
          Quay lại danh sách
        </a>
      </div>

      <div class="row">
        <div class="col-xl-8 col-lg-10">
          <div class="card shadow mb-4">
            <div class="card-header py-3">
              <h2
                class="h6 m-0 font-weight-bold text-primary"
                th:text="${editing} ? 'Thông tin tài khoản' : 'Tạo tài khoản mới'"
              ></h2>
            </div>
            <div class="card-body">
              <form
                th:if="${!editing}"
                th:action="@{${formAction}}"
                th:object="${registerForm}"
                method="post"
              >
                <div
                  class="alert alert-danger"
                  role="alert"
                  th:if="${#fields.hasGlobalErrors()}"
                >
                  <ul class="mb-0">
                    <li th:each="error : ${#fields.globalErrors()}" th:text="${error}"></li>
                  </ul>
                </div>

                <div class="form-group">
                  <label for="fullName">Họ và tên <span class="text-danger">*</span></label>
                  <input
                    class="form-control"
                    th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                    id="fullName"
                    th:field="*{fullName}"
                    maxlength="100"
                    required
                  />
                  <div class="invalid-feedback" th:errors="*{fullName}"></div>
                </div>
                <div class="form-group">
                  <label for="username">Tên đăng nhập <span class="text-danger">*</span></label>
                  <input
                    class="form-control"
                    th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                    id="username"
                    th:field="*{username}"
                    minlength="3"
                    maxlength="50"
                    required
                  />
                  <div class="invalid-feedback" th:errors="*{username}"></div>
                </div>
                <div class="form-group">
                  <label for="email">Email <span class="text-danger">*</span></label>
                  <input
                    class="form-control"
                    th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                    id="email"
                    th:field="*{email}"
                    type="email"
                    maxlength="100"
                    required
                  />
                  <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <div class="form-group">
                  <label for="phoneNumber">Số điện thoại</label>
                  <input
                    class="form-control"
                    th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid'"
                    id="phoneNumber"
                    th:field="*{phoneNumber}"
                    type="tel"
                  />
                  <div class="invalid-feedback" th:errors="*{phoneNumber}"></div>
                </div>
                <div class="form-group">
                  <label for="address">Địa chỉ</label>
                  <input
                    class="form-control"
                    th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'"
                    id="address"
                    th:field="*{address}"
                    maxlength="255"
                  />
                  <div class="invalid-feedback" th:errors="*{address}"></div>
                </div>
                <div class="form-group">
                  <label for="password">Mật khẩu <span class="text-danger">*</span></label>
                  <input
                    class="form-control"
                    th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                    id="password"
                    th:field="*{password}"
                    type="password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                  />
                  <div class="invalid-feedback" th:errors="*{password}"></div>
                  <small class="form-text text-muted">Mật khẩu phải có ít nhất 6 ký tự.</small>
                </div>
                <div class="d-flex justify-content-end flex-wrap mt-4">
                  <a class="btn btn-outline-secondary mr-2 mb-2" th:href="@{/admin/users}">Hủy</a>
                  <button class="btn btn-primary mb-2" type="submit">Tạo tài khoản</button>
                </div>
              </form>

              <form
                th:if="${editing}"
                th:action="@{${formAction}}"
                th:object="${userForm}"
                method="post"
              >
                <div
                  class="alert alert-danger"
                  role="alert"
                  th:if="${#fields.hasGlobalErrors()}"
                >
                  <ul class="mb-0">
                    <li th:each="error : ${#fields.globalErrors()}" th:text="${error}"></li>
                  </ul>
                </div>

                <div class="form-group">
                  <label for="fullName">Họ và tên <span class="text-danger">*</span></label>
                  <input
                    class="form-control"
                    th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                    id="fullName"
                    th:field="*{fullName}"
                    maxlength="100"
                    required
                  />
                  <div class="invalid-feedback" th:errors="*{fullName}"></div>
                </div>
                <div class="form-group">
                  <label for="username">Tên đăng nhập <span class="text-danger">*</span></label>
                  <input
                    class="form-control"
                    th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                    id="username"
                    th:field="*{username}"
                    minlength="3"
                    maxlength="50"
                    required
                  />
                  <div class="invalid-feedback" th:errors="*{username}"></div>
                </div>
                <div class="form-group">
                  <label for="email">Email <span class="text-danger">*</span></label>
                  <input
                    class="form-control"
                    th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                    id="email"
                    th:field="*{email}"
                    type="email"
                    maxlength="100"
                    required
                  />
                  <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <div class="form-group">
                  <label for="phoneNumber">Số điện thoại</label>
                  <input
                    class="form-control"
                    th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid'"
                    id="phoneNumber"
                    th:field="*{phoneNumber}"
                    type="tel"
                  />
                  <div class="invalid-feedback" th:errors="*{phoneNumber}"></div>
                </div>
                <div class="form-group">
                  <label for="address">Địa chỉ</label>
                  <input
                    class="form-control"
                    th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'"
                    id="address"
                    th:field="*{address}"
                    maxlength="255"
                  />
                  <div class="invalid-feedback" th:errors="*{address}"></div>
                </div>
                <div class="form-group">
                  <label for="password">Mật khẩu mới</label>
                  <input
                    class="form-control"
                    th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                    id="password"
                    th:field="*{password}"
                    type="password"
                    minlength="6"
                    autocomplete="new-password"
                  />
                  <div class="invalid-feedback" th:errors="*{password}"></div>
                  <small class="form-text text-muted">Để trống nếu không muốn đổi mật khẩu.</small>
                </div>
                <div class="d-flex justify-content-end flex-wrap mt-4">
                  <a class="btn btn-outline-secondary mr-2 mb-2" th:href="@{/admin/users}">Hủy</a>
                  <button class="btn btn-primary mb-2" type="submit">Lưu thay đổi</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
