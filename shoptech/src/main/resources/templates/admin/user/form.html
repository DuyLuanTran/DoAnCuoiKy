<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${formTitle} + ' | ShopTech'"></title>
    <link rel="stylesheet" th:href="@{/admin/css/sb-admin-2.min.css}">
    <link rel="stylesheet" th:href="@{/admin/css/user-management.css}">
</head>
<body class="admin-page">
<header class="topbar">
    <a class="brand" th:href="@{/admin/users}">SHOPTECH <span>Quản trị</span></a>
    <nav><a class="active" th:href="@{/admin/users}">Người dùng</a><a th:href="@{/admin/users/trash}">Thùng rác</a><a th:href="@{/account}">Tài khoản</a></nav>
    <form th:action="@{/logout}" method="post"><button class="button secondary" type="submit">Đăng xuất</button></form>
</header>
<main class="page-container narrow-container">
    <div class="page-heading">
        <div><p class="eyebrow">QUẢN TRỊ HỆ THỐNG</p><h1 th:text="${formTitle}"></h1><p class="muted">Thông tin tài khoản được lưu trong hệ thống ShopTech.</p></div>
    </div>
    <section class="panel form-panel">
        <div class="notice error" th:if="${#fields.hasGlobalErrors()}">
            <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
        </div>
        <form th:if="${!editing}" th:action="@{${formAction}}" th:object="${registerForm}" method="post">
            <div class="form-grid">
                <div class="field"><label for="fullName">Họ và tên</label><input id="fullName" th:field="*{fullName}" required><small class="field-error" th:errors="*{fullName}"></small></div>
                <div class="field"><label for="username">Tên đăng nhập</label><input id="username" th:field="*{username}" minlength="3" maxlength="50" required><small class="field-error" th:errors="*{username}"></small></div>
                <div class="field"><label for="email">Email</label><input id="email" th:field="*{email}" type="email" required><small class="field-error" th:errors="*{email}"></small></div>
                <div class="field"><label for="phoneNumber">Số điện thoại</label><input id="phoneNumber" th:field="*{phoneNumber}" type="tel"><small class="field-error" th:errors="*{phoneNumber}"></small></div>
                <div class="field field-full"><label for="address">Địa chỉ</label><input id="address" th:field="*{address}" maxlength="255"><small class="field-error" th:errors="*{address}"></small></div>
                <div class="field field-full"><label for="password">Mật khẩu (ít nhất 6 ký tự)</label><input id="password" th:field="*{password}" type="password" minlength="6" required><small class="field-error" th:errors="*{password}"></small></div>
            </div>
            <div class="form-actions"><a class="button secondary" th:href="@{/admin/users}">Hủy</a><button class="button primary" type="submit">Tạo tài khoản</button></div>
        </form>
        <form th:if="${editing}" th:action="@{${formAction}}" th:object="${userForm}" method="post">
            <div class="form-grid">
                <div class="field"><label for="fullName">Họ và tên</label><input id="fullName" th:field="*{fullName}" required><small class="field-error" th:errors="*{fullName}"></small></div>
                <div class="field"><label for="username">Tên đăng nhập</label><input id="username" th:field="*{username}" minlength="3" maxlength="50" required><small class="field-error" th:errors="*{username}"></small></div>
                <div class="field"><label for="email">Email</label><input id="email" th:field="*{email}" type="email" required><small class="field-error" th:errors="*{email}"></small></div>
                <div class="field"><label for="phoneNumber">Số điện thoại</label><input id="phoneNumber" th:field="*{phoneNumber}" type="tel"><small class="field-error" th:errors="*{phoneNumber}"></small></div>
                <div class="field field-full"><label for="address">Địa chỉ</label><input id="address" th:field="*{address}" maxlength="255"><small class="field-error" th:errors="*{address}"></small></div>
                <div class="field field-full"><label for="password">Mật khẩu mới (để trống nếu không đổi)</label><input id="password" th:field="*{password}" type="password" minlength="6" autocomplete="new-password"><small class="field-error" th:errors="*{password}"></small></div>
            </div>
            <div class="form-actions"><a class="button secondary" th:href="@{/admin/users}">Hủy</a><button class="button primary" type="submit">Lưu thay đổi</button></div>
        </form>
    </section>
</main>
</body>
</html>
