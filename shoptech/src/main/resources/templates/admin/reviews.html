<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin-layout :: layout('Đánh giá sản phẩm','reviews',~{::main})}"><body><main>
<h1 class="h3 mb-3 text-gray-800" th:text="${sellerArea == true} ? 'Đánh giá sản phẩm của shop' : 'Quản lý đánh giá sản phẩm'"></h1>
<p th:if="${sellerArea == true}">Xem đánh giá từ khách đã mua hàng và phản hồi khách hàng.</p><p th:unless="${sellerArea == true}">Ẩn đánh giá vi phạm hoặc hiện lại sau khi xem xét. Mọi lần thay đổi đều được lưu lịch sử.</p>
<p th:if="${reviews.empty}">Chưa có đánh giá.</p><p data-review-admin-message role="status" aria-live="polite"></p>
<article class="card shadow mb-4" th:each="review : ${reviews}"><div class="card-header d-flex flex-wrap justify-content-between"><a th:href="@{/products/{slug}(slug=${review.productSlug})}" th:text="${review.productName}"></a><span class="badge badge-light border" th:text="${review.hidden} ? 'Đã ẩn' : 'Đang hiển thị'"></span></div><div class="card-body">
<p><strong th:text="${review.author}"></strong> · <span th:text="${review.rating}+' / 5 sao'"></span> · <span th:text="${#temporals.format(review.createdAt.atZone(T(java.time.ZoneId).of('Asia/Ho_Chi_Minh')),'dd/MM/yyyy HH:mm')}"></span></p>
<p style="white-space:pre-wrap;overflow-wrap:anywhere" th:text="${review.content}"></p><div class="d-flex flex-wrap mb-3" style="gap:12px"><th:block th:each="file : ${review.media}"><a th:if="${file.kind == 'IMAGE'}" th:href="${file.url}" target="_blank" rel="noopener"><img th:src="${file.url}" alt="Ảnh đánh giá" style="width:100px;height:85px;object-fit:cover"></a><video th:if="${file.kind == 'VIDEO'}" th:src="${file.url}" controls preload="metadata" style="max-width:240px;max-height:150px"></video></th:block></div>
<div class="bg-light p-3 mb-3" th:if="${review.sellerReply != null}"><strong>Phản hồi của shop</strong><p class="mb-0" style="white-space:pre-wrap;overflow-wrap:anywhere" th:text="${review.sellerReply}"></p></div>
<p th:if="${review.reason != null}"><strong>Lý do kiểm duyệt:</strong> <span th:text="${review.reason}"></span></p>
<form th:if="${sellerArea == true and !review.hidden}" data-review-action="reply" th:attr="data-id=${review.id},data-version=${review.version}"><label th:for="'reply-'+${review.id}">Phản hồi khách hàng</label><textarea class="form-control mb-2" th:id="'reply-'+${review.id}" name="reply" required maxlength="2000" rows="3" th:text="${review.sellerReply}"></textarea><button class="btn btn-primary">Lưu phản hồi</button></form>
<form th:unless="${sellerArea == true}" data-review-action="moderation" th:attr="data-id=${review.id},data-version=${review.version},data-hidden=${!review.hidden}"><label th:for="'reason-'+${review.id}">Lý do <span th:text="${review.hidden} ? 'hiện lại' : 'ẩn đánh giá'"></span></label><input class="form-control mb-2" th:id="'reason-'+${review.id}" name="reason" required minlength="5" maxlength="1000"><button class="btn" th:classappend="${review.hidden} ? 'btn-outline-primary' : 'btn-outline-danger'" th:text="${review.hidden} ? 'Hiện lại đánh giá' : 'Ẩn đánh giá'"></button></form>
</div></article><nav class="d-flex justify-content-between"><a th:if="${reviews.hasPrevious()}" th:href="@{${sellerArea == true ? '/seller/reviews' : '/admin/reviews'}(page=${reviews.number-1})}">Trang trước</a><span th:text="'Trang '+${reviews.number+1}"></span><a th:if="${reviews.hasNext()}" th:href="@{${sellerArea == true ? '/seller/reviews' : '/admin/reviews'}(page=${reviews.number+1})}">Trang sau</a></nav>
<script th:src="@{/user/js/community.js}" defer></script></main></body></html>
