# Standalone config: launch with --spring.config.location=classpath:/application-isolated.properties
# No .env import, no source credentials and no automatic schema modification.
spring.application.name=shoptech-marketplace-sandbox
server.address=127.0.0.1
server.port=18081
spring.datasource.url=jdbc:postgresql://127.0.0.1:55432/shoptech_marketplace
spring.datasource.username=postgres
spring.datasource.password=${SANDBOX_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=4
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.docker.compose.enabled=false
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=26MB
shoptech.security.jwt.secret=${SANDBOX_JWT_SECRET}
shoptech.security.jwt.validity-minutes=120
shoptech.security.cookie-secure=false
shoptech.public-base-url=http://127.0.0.1:18081
shoptech.mail.from=sandbox@example.invalid
spring.mail.host=127.0.0.1
spring.mail.port=1
spring.mail.properties.mail.smtp.connectiontimeout=1000
spring.mail.properties.mail.smtp.timeout=1000
cloudinary.cloud-name=isolated-sandbox
cloudinary.api-key=disabled
cloudinary.api-secret=disabled
gemini.api.key=
gemini.api.model=disabled
