# ====================================================================
# SHOPTECH - CẤU HÌNH KẾT NỐI SUPABASE POSTGRESQL & SPRING BOOT
# ====================================================================

spring.application.name=shoptech
spring.datasource.driver-class-name=org.postgresql.Driver
# --------------------------------------------------------------------
# 1. CẤU HÌNH DATABASE (SUPABASE POSTGRESQL)
# --------------------------------------------------------------------
# Thay các giá trị bên dưới bằng thông tin từ Supabase Dashboard của bạn:
# Vào Supabase -> Settings -> Database -> Connection String -> JDBC
#
# LƯU Ý QUAN TRỌNG VỀ SUPABASE:
# - sslmode=require là bắt buộc khi kết nối cloud Supabase.
# - Port 5432: Direct Connection (Nếu mạng hỗ trợ IPv6).
# - Port 6543: Session Pooler (Khuyên dùng, hỗ trợ cả IPv4 và IPv6 ổn định).
# --------------------------------------------------------------------

# Driver & Connection thông qua biến môi trường .env
# Điền đường dẫn Supabase kèm giá trị mặc định đằng sau dấu :
spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.username=postgres.dztrhopimqfdurmgzlpx
spring.datasource.password=Duyluan5906



# Tắt khởi tạo tự động từ local
spring.sql.init.mode=never
# --------------------------------------------------------------------
# 2. HIKARICP CONNECTION POOL (TỐI ƯU CHO SUPABASE CLOUD)
# Tránh lỗi Supabase tự ngắt kết nối khi nhàn rỗi (idle timeout)
# --------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=45000

# --------------------------------------------------------------------
# 3. JPA / HIBERNATE SETTINGS
# --------------------------------------------------------------------
# 'update': Tự động cập nhật bảng theo Entity Java (không xoá dữ liệu cũ)
# 'validate': Chỉ kiểm tra bảng có khớp Entity hay không (an toàn nhất cho DB thật)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --------------------------------------------------------------------
# 4. THYMELEAF & STATIC RESOURCES
# --------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# --------------------------------------------------------------------
# 5. UPLOAD FILE / CLOUDINARY (CHO NGƯỜI 2 UPLOAD ẢNH SẢN PHẨM)
# --------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Cloudinary credentials (Người 2 sẽ điền key từ tài khoản Cloudinary)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.docker.compose.enabled=false
# Tắt DDL auto execution của Hibernate

