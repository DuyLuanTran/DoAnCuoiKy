# ====================================================================
# SHOPTECH - CẤU HÌNH KẾT NỐI SUPABASE POSTGRESQL & SPRING BOOT
# ====================================================================

spring.application.name=shoptech
spring.config.import=optional:file:./.env[.properties],optional:file:./shoptech/.env[.properties]
spring.datasource.driver-class-name=org.postgresql.Driver

# --------------------------------------------------------------------
# 1. CẤU HÌNH DATABASE (SUPABASE POSTGRESQL)
# --------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.sql.init.mode=never

# --------------------------------------------------------------------
# 2. HIKARICP CONNECTION POOL (TỐI ƯU CHO SUPABASE CLOUD)
# --------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=45000

# --------------------------------------------------------------------
# 3. JPA / HIBERNATE SETTINGS
# --------------------------------------------------------------------
# Shared Supabase schema must only be changed through reviewed scripts.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --------------------------------------------------------------------
# 4. THYMELEAF & STATIC RESOURCES
# --------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# --------------------------------------------------------------------
# 5. UPLOAD FILE / CLOUDINARY
# --------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.docker.compose.enabled=false

# --------------------------------------------------------------------
# 6. JWT AUTHENTICATION
# --------------------------------------------------------------------
shoptech.security.jwt.secret=${JWT_SECRET:4MA4uk/7X6cj3d7DsvMovfaa4xMOwaiJiUmM0u42Vjk=}
shoptech.security.jwt.validity-minutes=${JWT_VALIDITY_MINUTES:20}
shoptech.security.cookie-secure=${COOKIE_SECURE:false}

# --------------------------------------------------------------------
# 7. EMAIL (GMAIL SMTP)
# --------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

shoptech.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@shoptech.local}}
shoptech.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.csrf=TRACE

gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=${GEMINI_API_MODEL:gemini-3.5-flash-lite}